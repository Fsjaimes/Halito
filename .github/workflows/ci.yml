name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: halito
          POSTGRES_PASSWORD: halito_dev
          POSTGRES_DB: halito
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U halito -d halito"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      HALITO_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir las imágenes de producción
        run: |
          docker build -t halito-api backend
          docker build -t halito-web web
