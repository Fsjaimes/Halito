# Despliegue completo: base de datos, API, interfaz y tareas de ingesta.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm ingest        # datos de estaciones
#   docker compose -f docker-compose.prod.yml run --rm heat          # calor del suelo
#
# Variables en .env: HALITO_DB_PASSWORD (obligatoria), SITE_ADDRESS (dominio o «:80»),
# HALITO_SOCRATA_APP_TOKEN (recomendada).

x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment:
    HALITO_DB_HOST: db
    HALITO_DB_PORT: 5432
    HALITO_DB_USER: ${HALITO_DB_USER:-halito}
    HALITO_DB_PASSWORD: ${HALITO_DB_PASSWORD:?Define HALITO_DB_PASSWORD en .env}
    HALITO_DB_NAME: ${HALITO_DB_NAME:-halito}
    HALITO_SOCRATA_APP_TOKEN: ${HALITO_SOCRATA_APP_TOKEN:-}
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: timescale/timescaledb-ha:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${HALITO_DB_USER:-halito}
      POSTGRES_PASSWORD: ${HALITO_DB_PASSWORD:?Define HALITO_DB_PASSWORD en .env}
      POSTGRES_DB: ${HALITO_DB_NAME:-halito}
    volumes:
      - db_data:/home/postgres/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build: ./web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

  # Tareas que se corren a mano o desde cron; no quedan encendidas.
  ingest:
    <<: *backend
    restart: "no"
    profiles: [jobs]
    command: >
      sh -c "halito sync-stations && halito ingest-cdmb && halito ingest-ideam --workers 2
      && halito detect-episodes"

  heat:
    <<: *backend
    restart: "no"
    profiles: [jobs]
    command: ["halito", "ingest-landsat"]

volumes:
  db_data:
  caddy_data:
